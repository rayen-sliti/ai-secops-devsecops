---
# Installation Docker sur RHEL 9

- name: Ajouter le repo Docker
  get_url:
    url: https://download.docker.com/linux/rhel/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo

- name: Installer Docker CE
  dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present

- name: Démarrer Docker
  systemd:
    name: docker
    state: started
    enabled: true

- name: Ajouter l'utilisateur au groupe docker
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes

- name: Configurer Docker daemon
  copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {"max-size": "10m", "max-file": "3"},
        "storage-driver": "overlay2"
      }
  notify: restart docker

- name: vm.max_map_count pour Elasticsearch/Wazuh
  sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: yes
