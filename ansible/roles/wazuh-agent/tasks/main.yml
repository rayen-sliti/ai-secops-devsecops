---
# Installation Wazuh Agent sur Linux
# Se connecte au Wazuh Manager

- name: Ajouter le repo Wazuh
  get_url:
    url: https://packages.wazuh.com/4.x/yum/wazuh.repo
    dest: /etc/yum.repos.d/wazuh.repo
    mode: '0644'

- name: Installer wazuh-agent
  dnf:
    name: wazuh-agent
    state: present

- name: Configurer l'agent Wazuh
  template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    backup: yes
  notify: restart wazuh-agent

- name: Enregistrement de l'agent auprès du Manager
  command: >
    /var/ossec/bin/agent-auth
    -m {{ wazuh_manager_ip }}
    -A {{ inventory_hostname }}
  args:
    creates: /var/ossec/etc/client.keys
  ignore_errors: true

- name: Démarrer et activer wazuh-agent
  systemd:
    name: wazuh-agent
    state: started
    enabled: true
    daemon_reload: yes
